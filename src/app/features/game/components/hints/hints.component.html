@if (hints().audio; as src) {
  <button
    mat-icon-button
    [appAudio]="src"
  >
    <mat-icon>volume_up</mat-icon>
  </button>
}
@if (hints().translation; as translation) {
  <button
    mat-icon-button
    (click)="toggleTranslation()"
  >
    <mat-icon>translate</mat-icon>
  </button>
  <span [class.show]="showTranslation()">
    {{ translation }}
  </span>
}
