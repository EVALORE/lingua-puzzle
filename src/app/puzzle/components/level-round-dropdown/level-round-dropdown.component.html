<mat-form-field>
  <mat-label>Level</mat-label>
  <mat-select [formControl]="level">
    @for (level of levels(); track $index) {
      <mat-option [value]="level.value">{{ level.value }}</mat-option>
    }
  </mat-select>
</mat-form-field>

<mat-form-field>
  <mat-label>Level</mat-label>
  <mat-select [formControl]="level">
    @for (round of rounds(); track $index) {
      <mat-option [value]="round.value"> {{ round.value }}</mat-option>
    }
  </mat-select>
</mat-form-field>
