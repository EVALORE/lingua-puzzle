<mat-form-field>
  <mat-label>Level</mat-label>
  <mat-select
    [formControl]="level"
    (selectionChange)="onLevelChange()"
  >
    @for (level of levels(); track $index) {
      <mat-option [value]="$index + 1">{{ $index + 1 }}</mat-option>
    }
  </mat-select>
</mat-form-field>

@if (rounds()) {
  <mat-form-field>
    <mat-label>Level</mat-label>
    <mat-select
      [formControl]="level"
      (selectionChange)="onRoundChange()"
    >
      @for (round of rounds(); track $index) {
        <mat-option [value]="$index + 1"> {{ $index + 1 }}</mat-option>
      }
    </mat-select>
  </mat-form-field>
}
