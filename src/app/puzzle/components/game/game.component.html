<app-hints [hints]="hints()"/>

<mat-card [style]="getBoardStyles()">
  @for (tiles of solvedTiles(); track $index) {
    <app-tiles [tiles]="tiles" [solved]="true"/>
  }
  <app-tiles [tiles]="result()" (cardClick)="moveCardToSource($event)"/>
</mat-card>

<app-tiles [tiles]="source()" (cardClick)="moveCardToResult($event)"/>

@if (isSourceEmpty()) {
  <button
    mat-raised-button
    (click)="autocompleteSentenceSolving()"
  >
    auto complete
  </button>
  <button
    mat-raised-button
    (click)="isResultCorrect() ? handleNextStep() : checkCards()"
  >
    {{ isResultCorrect() ? 'continue' : 'check' }}
  </button>
}
