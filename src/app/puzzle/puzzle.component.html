<app-level-round-dropdown
  [currentRound]="levelCurrent()"
  [currentLevel]="roundCurrent()"
  (currentRoundChange)="levelChange($event)"
  (currentLevelChange)="roundChange($event)"
  [totalLevels]="totalLevels"
  [totalRounds]="totalRounds()"
/>

@if (round$ | async; as round) {
  <app-game
    [sentences]="round.words"
    (puzzleSolved)="nextRound()"
  />
}
