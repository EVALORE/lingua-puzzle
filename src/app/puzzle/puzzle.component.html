@let l = levels();
@let r = rounds();

<app-level-round-dropdown
  [levels]="l.current"
  [rounds]="r.current"
  (levelsChange)="levelChange($event)"
  (roundsChange)="roundChange($event)"
  [levelsCount]="l.count"
  [roundsCount]="r.count"
/>

@if (round$ | async; as round) {
  <app-game
    [sentences]="round.words"
    (puzzleSolved)="nextRound()"
  />
}
