@if (puzzleData | async; as data) {
  <app-level-round-dropdown
    [puzzleIndex]="data.puzzleIndex"
    [levelNumber]="data.levelNumber"
    (puzzleIndexChange)="roundChange($event)"
    (levelNumberChange)="levelChange($event)"
    [totalLevels]="data.totalLevels"
    [totalPuzzles]="data.totalPuzzles"
  />
}
@if (round$ | async; as round) {
  <app-game
    [words]="round.words"
    (puzzleSolved)="nextRound()"
  />
}
