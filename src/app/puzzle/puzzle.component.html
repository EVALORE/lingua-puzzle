@if (gameState$ | async; as state) {
  <app-level-round-dropdown
    [puzzleIndex]="state.puzzleIndex"
    [levelNumber]="state.levelNumber"
    (puzzleIndexChange)="roundChange($event)"
    (levelNumberChange)="levelChange($event)"
    [totalLevels]="state.totalLevels"
    [totalPuzzles]="state.totalPuzzles"
  />
}
@if (round$ | async; as round) {
  <app-game
    [words]="round.words"
    (puzzleSolved)="nextRound()"
  />
}
