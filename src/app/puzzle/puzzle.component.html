@if (levelRoundData$ | async; as data) {
  <app-level-round-dropdown
    [currentRound]="data.round"
    [currentLevel]="data.level"
    (currentRoundChange)="roundChange($event)"
    (currentLevelChange)="levelChange($event)"
    [totalLevels]="data.levelCount"
    [totalRounds]="data.roundsCount"
  />
}
@if (round$ | async; as round) {
  <app-game
    [sentences]="round.words"
    (puzzleSolved)="nextRound()"
  />
}
